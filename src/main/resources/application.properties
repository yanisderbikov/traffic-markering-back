server.port=8090

allowed.origins=${ALLOWED_ORIGINS}
url.back=${URL_BACK:http://localhost:8090}

# PostgreSQL Database Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Схему ведут только миграции: Hibernate её проверяет, но никогда не правит
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.task.scheduling.pool.size=2

jwt.secret=${JWT_SECRET}
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:604800}

email.notisend.api.key=${EMAIL_NOTISEND_API_KEY}
email.notisend.email.address=${EMAIL_NOTISEND_EMAIL_ADDRESS}
email.notisend.from.name=${EMAIL_NOTISEND_FROM_NAME}
# Фича-флаг anyforms-email-service: true — письма идут через него (URL и токен обязательны),
# false — через NotiSend, даже если URL задан.
email.remote.enabled=${REMOTE_EMAIL_SERVICE_ENABLED:false}
email.service.url=${EMAIL_SERVICE_URL:}
email.service.token=${EMAIL_SERVICE_TOKEN:}

tasks.batch-size=${TASKS_BATCH_SIZE:5}
tasks.fixed-rate-ms=${TASKS_FIXED_RATE_MS:60000}
tasks.initial-delay-ms=${TASKS_INITIAL_DELAY_MS:10000}

# Межсервисный токен для внешнего анализатора просмотров.
# Пусто = технические ручки закрыты для всех (fail-closed)
service.jwt.token=${SERVICE_JWT_TOKEN:}

views.sync.enabled=${VIEWS_SYNC_ENABLED:true}
views.sync.fixed-rate-ms=${VIEWS_SYNC_FIXED_RATE_MS:3600000}
views.sync.initial-delay-ms=${VIEWS_SYNC_INITIAL_DELAY_MS:30000}

s3.endpoint=${S3_ENDPOINT:https://storage.yandexcloud.net}
s3.region=${S3_REGION:ru-central1}
s3.access-key=${S3_KEY}
s3.secret-key=${S3_SECRET}
s3.bucket=${S3_BUCKET}

management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

app.front.url=${FRONT_URL:http://localhost:3000}

app.super-admin.email=${SUPER_ADMIN_EMAIL}

earnings.enabled=${EARNINGS_ENABLED:true}
earnings.cron=${EARNINGS_CRON:0 0 0 * * *}
earnings.zone=${EARNINGS_ZONE:UTC}
# Окно удержания: в кошелёк уезжают только просмотры, которым уже столько дней —
# площадка успевает вычистить ботов, антифрод успевает сработать. 0 = без окна
earnings.hold-days=${EARNINGS_HOLD_DAYS:7}
# Антифрод: пороги баллов и репутации (см. FraudProperties)
fraud.suspicious-threshold=${FRAUD_SUSPICIOUS_THRESHOLD:30}
fraud.fraud-threshold=${FRAUD_FRAUD_THRESHOLD:70}
fraud.min-views-for-ratios=${FRAUD_MIN_VIEWS_FOR_RATIOS:5000}
fraud.new-creator-max-payable-views=${FRAUD_NEW_CREATOR_MAX_PAYABLE_VIEWS:50000}
fraud.trusted-after-clean-videos=${FRAUD_TRUSTED_AFTER_CLEAN_VIDEOS:3}
fraud.strikes-to-block=${FRAUD_STRIKES_TO_BLOCK:2}

wallet.top-up-tron-address=${TOP_UP_TRON_ADDRESS}

campaign.min-budget-rub=${CAMPAIGN_MIN_BUDGET_RUB:10000}
campaign.max-payout-budget-percent=${CAMPAIGN_MAX_PAYOUT_BUDGET_PERCENT:10}

commission.percent=${COMMISSION_PERCENT:10}
commission.partner-share-percent=${COMMISSION_PARTNER_SHARE_PERCENT:10}

social.token.secret=${SOCIAL_TOKEN_SECRET:${JWT_SECRET}}

social.youtube.api-key=${YOUTUBE_API_KEY:}
social.youtube.client-id=${YOUTUBE_CLIENT_ID:}
social.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
social.tiktok.client-key=${TIKTOK_CLIENT_KEY:}
social.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
social.instagram.client-id=${INSTAGRAM_CLIENT_ID:}
social.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}

# Фича-флаг ScrapeCreators: true — аккаунты привязываются по коду в описании профиля,
# просмотры читаются через api.scrapecreators.com, OAuth площадок не используется.
# OAuth-привязки и Scrape-привязки живут раздельно: при переключении криаторы привязывают аккаунты заново.
social.scrape.enabled=${SOCIAL_SCRAPE_ENABLED:false}
social.scrape.api-key=${SCRAPE_CREATORS_API_KEY:}
social.scrape.base-url=${SCRAPE_CREATORS_BASE_URL:https://api.scrapecreators.com}

# Видео-студия (перенос Offer Studio): FFmpeg-рендер и Telegram-бот на вебхуке
# Адрес сайта для кнопок бота (по умолчанию FRONT_URL)
studio.site-url=${STUDIO_SITE_URL:${FRONT_URL:http://localhost:3000}}
studio.worker-enabled=${STUDIO_WORKER_ENABLED:true}
studio.ffmpeg=${STUDIO_FFMPEG:ffmpeg}
studio.ffprobe=${STUDIO_FFPROBE:ffprobe}
studio.daily-limit=${STUDIO_DAILY_LIMIT:5}
studio.max-active=${STUDIO_MAX_ACTIVE:2}
studio.render-timeout-seconds=${STUDIO_RENDER_TIMEOUT_SECONDS:300}
# Пусто — бот выключен, студия на сайте работает
studio.telegram.bot-token=${STUDIO_TELEGRAM_BOT_TOKEN:}
studio.telegram.bot-username=${STUDIO_TELEGRAM_BOT_USERNAME:}
studio.telegram.webhook-secret=${STUDIO_TELEGRAM_WEBHOOK_SECRET:}
# Публичный HTTPS-адрес бэка для вебхука; пусто — url.back
studio.telegram.webhook-base-url=${STUDIO_TELEGRAM_WEBHOOK_BASE_URL:}
studio.telegram.register-webhook=${STUDIO_TELEGRAM_REGISTER_WEBHOOK:true}
# Иконки из пака t.me/addemoji/tgiosicons (нужен Premium у владельца бота); false — обычные эмодзи
studio.telegram.custom-emoji=${STUDIO_TELEGRAM_CUSTOM_EMOJI:true}
# Пак, из которого при старте подгружаются иконки для всех эмодзи (обоих ботов); пусто — только ручная разметка
studio.telegram.emoji-pack=${TELEGRAM_EMOJI_PACK:tgiosicons}
# ── Модерация роликов через Telegram: отдельный бот, заявки раздаются менеджерам по одной ──
moderation.telegram.bot-token=${MODERATION_TELEGRAM_BOT_TOKEN:}
moderation.telegram.bot-username=${MODERATION_TELEGRAM_BOT_USERNAME:}
moderation.telegram.webhook-secret=${MODERATION_TELEGRAM_WEBHOOK_SECRET:}
moderation.telegram.webhook-base-url=${MODERATION_TELEGRAM_WEBHOOK_BASE_URL:}
moderation.telegram.register-webhook=${MODERATION_TELEGRAM_REGISTER_WEBHOOK:true}
# Иконки из пака t.me/addemoji/tgiosicons, как у бота студии; false — обычные эмодзи
moderation.telegram.custom-emoji=${MODERATION_TELEGRAM_CUSTOM_EMOJI:true}
# Сколько минут заявка висит у менеджера, потом уходит следующему
moderation.hold-minutes=${MODERATION_HOLD_MINUTES:30}
# После скольких пропущенных подряд заявок менеджер становится неактивным; 0 — не выключать
moderation.pause-after-missed=${MODERATION_PAUSE_AFTER_MISSED:3}
moderation.dispatch-rate-ms=${MODERATION_DISPATCH_RATE_MS:15000}
moderation.yt-dlp=${MODERATION_YT_DLP:yt-dlp}
notifications.batch-size=${NOTIFICATIONS_BATCH_SIZE:25}
