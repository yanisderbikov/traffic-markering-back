server.port=8090

allowed.origins=${ALLOWED_ORIGINS}
url.back=${URL_BACK:http://localhost:8090}

# PostgreSQL Database Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Схему ведут только миграции: Hibernate её проверяет, но никогда не правит
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.task.scheduling.pool.size=2

jwt.secret=${JWT_SECRET}
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:604800}

email.notisend.api.key=${EMAIL_NOTISEND_API_KEY}
email.notisend.email.address=${EMAIL_NOTISEND_EMAIL_ADDRESS}
email.notisend.from.name=${EMAIL_NOTISEND_FROM_NAME}

tasks.batch-size=${TASKS_BATCH_SIZE:5}
tasks.fixed-rate-ms=${TASKS_FIXED_RATE_MS:60000}
tasks.initial-delay-ms=${TASKS_INITIAL_DELAY_MS:10000}

# Межсервисный токен для внешнего анализатора просмотров.
# Пусто = технические ручки закрыты для всех (fail-closed)
service.jwt.token=${SERVICE_JWT_TOKEN:}

views.sync.enabled=${VIEWS_SYNC_ENABLED:true}
views.sync.fixed-rate-ms=${VIEWS_SYNC_FIXED_RATE_MS:3600000}
views.sync.initial-delay-ms=${VIEWS_SYNC_INITIAL_DELAY_MS:30000}

s3.endpoint=${S3_ENDPOINT:https://storage.yandexcloud.net}
s3.region=${S3_REGION:ru-central1}
s3.access-key=${S3_KEY}
s3.secret-key=${S3_SECRET}
s3.bucket=${S3_BUCKET}

management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

app.front.url=${FRONT_URL:http://localhost:3000}

app.super-admin.email=${SUPER_ADMIN_EMAIL}

earnings.enabled=${EARNINGS_ENABLED:true}
earnings.cron=${EARNINGS_CRON:0 0 3 * * *}
earnings.zone=${EARNINGS_ZONE:Europe/Moscow}
# Окно удержания: в кошелёк уезжают только просмотры, которым уже столько дней —
# площадка успевает вычистить ботов, антифрод успевает сработать. 0 = без окна
earnings.hold-days=${EARNINGS_HOLD_DAYS:7}
# Антифрод: пороги баллов и репутации (см. FraudProperties)
fraud.suspicious-threshold=${FRAUD_SUSPICIOUS_THRESHOLD:30}
fraud.fraud-threshold=${FRAUD_FRAUD_THRESHOLD:70}
fraud.min-views-for-ratios=${FRAUD_MIN_VIEWS_FOR_RATIOS:5000}
fraud.new-creator-max-payable-views=${FRAUD_NEW_CREATOR_MAX_PAYABLE_VIEWS:50000}
fraud.trusted-after-clean-videos=${FRAUD_TRUSTED_AFTER_CLEAN_VIDEOS:3}
fraud.strikes-to-block=${FRAUD_STRIKES_TO_BLOCK:2}

wallet.top-up-tron-address=${TOP_UP_TRON_ADDRESS}

social.token.secret=${SOCIAL_TOKEN_SECRET:${JWT_SECRET}}

social.youtube.api-key=${YOUTUBE_API_KEY:}
social.youtube.client-id=${YOUTUBE_CLIENT_ID:}
social.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
social.tiktok.client-key=${TIKTOK_CLIENT_KEY:}
social.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
social.instagram.client-id=${INSTAGRAM_CLIENT_ID:}
social.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
